name: Ape tests

on:
  push:
    branches:
    - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        tokens_to_test: [6, 8, 18, usdt]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: install requirements
      run: python3 -m pip install -r requirements.txt 

    - name: pin ape plugins
      run: |
        python3 -m pip install \
          "eth-ape==0.8.10" \
          "ape-solidity==0.8.5" \
          "ape-vyper==0.8.12" \
          "ape-hardhat==0.8.5"

    - name: install vyper compiler
      run: ape vyper vvm install 0.3.10
    
    - name: Compile contracts
      # TODO: Force recompiles until ape compile caching is fixed
      run: ape compile --force --size

    # Needed to use hardhat
    - name: Setup node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: Install node dependencies
      run: |
        corepack enable
        yarn install --frozen-lockfile

    - name: output current installation
      run: pip freeze

    - name: Run tests
      run: ape test -s
      timeout-minutes: 15
      env:
        TOKENS_TO_TEST: ${{ matrix.tokens_to_test }}
